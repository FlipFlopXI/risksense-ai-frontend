name: medguide
description: RiskSense AI - Secure Clinical Decision Support System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & State
  go_router: ^13.2.0

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # HTTP
  dio: ^5.4.3+1
  url_launcher: ^6.3.2

  # Utilities
  intl: ^0.19.0

  # Animations
  flutter_animate: ^4.5.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/risksense_logo.jpg
